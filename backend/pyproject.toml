[project]
name = "backend"
version = "1.0.0"
description = "Publicat backend: personalised research-paper triage"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.105.2",
    "apscheduler>=3.11.2",
    "fastapi>=0.136.3",
    "google-genai>=2.7.0",
    "httpx>=0.28.1",
    "numpy>=2.0",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.2",
    "scipy>=1.13",
    "sqlalchemy>=2.0.50",
    "uvicorn>=0.48.0",
]

[project.optional-dependencies]
# Local SPECTER2 embeddings (PyTorch, ~2 GB). Only needed to embed papers that
# Semantic Scholar has no vector for; the app runs without it.
local = [
    "sentence-transformers>=5.5.1",
    "torch>=2.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
